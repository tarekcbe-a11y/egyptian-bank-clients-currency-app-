<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>#جروب_عملاء_البنوك_المصرية - أسعار العملات اللحظية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --border-gold: #d4af37;
            --text-gold: #f3e5ab;
            --text-white: #ffffff;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            padding: 10px;
            display: flex;
            justify-content: center;
        }
        .phone-container {
            width: 100%;
            max-width: 400px;
            background: var(--bg-color);
            border: 2px solid var(--border-gold);
            border-radius: 24px;
            padding: 15px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.2);
            position: relative;
            padding-bottom: 60px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo-box {
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            color: #000;
            font-weight: 900;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 14px;
        }
        .group-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-gold);
        }
        .banner-text {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            padding: 6px;
            text-align: center;
            font-size: 11px;
            color: var(--text-gold);
            margin-bottom: 10px;
        }
        .rates-table {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 15px;
        }
        .rate-row {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 8px;
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .curr-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .flag { font-size: 18px; }
        .c-name { font-size: 12px; font-weight: 700; color: #fff; }
        .c-code { font-size: 10px; color: var(--text-muted); }
        
        .curr-right {
            display: flex;
            gap: 12px;
            text-align: center;
        }
        .p-box span { display: block; font-size: 9px; color: var(--text-muted); }
        .p-box strong { font-size: 12px; color: var(--border-gold); }

        .converter-section {
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
        }
        .converter-title {
            font-size: 12px;
            color: var(--border-gold);
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            border-bottom: 1px dashed rgba(212, 175, 55, 0.3);
            padding-bottom: 4px;
        }
        .conv-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        .input-group label {
            font-size: 10px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 2px;
        }
        .input-group input, .input-group select {
            width: 100%;
            background: #0b0f19;
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #fff;
            padding: 6px;
            border-radius: 6px;
            font-size: 11px;
            outline: none;
        }
        .result-box {
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            color: #000;
            font-weight: 700;
            text-align: center;
            padding: 8px;
            border-radius: 6px;
            font-size: 13px;
        }
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #080c14;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            border-bottom-left-radius: 22px;
            border-bottom-right-radius: 22px;
        }
        .nav-item {
            text-align: center;
            font-size: 10px;
            color: var(--text-muted);
            cursor: pointer;
        }
        .nav-item.active {
            color: var(--border-gold);
            font-weight: 700;
        }
        .footer-status {
            text-align: center;
            font-size: 9px;
            color: var(--text-muted);
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="header">
        <div class="logo-area">
            <div class="logo-box">EG</div>
            <div class="group-title">جروب عملاء البنوك المصرية</div>
        </div>
        <div style="font-size: 16px;">🇪🇬 🇰🇼</div>
    </div>

    <div class="banner-text">
        تطبيق أسعار العملات الحية - بإشراف المستشار المالي (طارق متولي)
    </div>

    <!-- جدول الأسعار المدمج -->
    <div class="rates-table" id="ratesTable">
        <div style="text-align: center; color: var(--text-muted); padding: 15px;">جاري تحميل الأسعار...</div>
    </div>

    <!-- محول العملات -->
    <div class="converter-section">
        <div class="converter-title">محول العملات | CURRENCY CONVERTER</div>
        <div class="input-group" style="margin-bottom: 8px;">
            <label>المبلغ المراد تحويله</label>
            <input type="number" id="amountInput" value="1000" oninput="convertCurrency()">
        </div>
        <div class="conv-grid">
            <div class="input-group">
                <label>من العملة</label>
                <select id="fromCurrency" onchange="convertCurrency()"></select>
            </div>
            <div class="input-group">
                <label>إلى العملة</label>
                <select id="targetCurrency" onchange="convertCurrency()"></select>
            </div>
        </div>
        <div class="result-box" id="conversionResult">
            النتيجة: --
        </div>
    </div>

    <div class="footer-status" id="footerTimestamp">
        Market Status: <span style="color: var(--accent-green);">OPEN</span> | جاري تحميل وقت التحديث...
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="bottom-nav">
        <div class="nav-item active">🏠<br>Home</div>
        <div class="nav-item">💱<br>Converter</div>
        <div class="nav-item">📈<br>Rates</div>
        <div class="nav-item">👤<br>Profile</div>
    </div>
</div>

<script>
    const apiURL = "https://script.google.com/macros/s/AKfycbzCRaR2BMwF5krfzHbW0tsMPvBOTEaTOiPMVGrPBr8o4PgKDu5Ht9embE_AD1c-b8Wg/exec";

    const flags = {
        "USD": "🇺🇸", "EUR": "🇪🇺", "GBP": "🇬🇧",
        "SAR": "🇸🇦", "AED": "🇦🇪", "KWD": "🇰🇼", "EGP": "🇪🇬"
    };

    let globalData = [];

    async function fetchRates() {
        try {
            const response = await fetch(apiURL);
            const data = await response.json();
            
            // تصفية العملات التي ليس لها أسعار أو التي تساوي صفر
            globalData = data.filter(item => item.buy > 0 && item.sell > 0);
            
            let tableHTML = '';
            let optionsHTML = '';

            globalData.forEach(item => {
                let flag = flags[item.code] || "💵";
                
                // صف الجدول المدمج
                tableHTML += `
                    <div class="rate-row">
                        <div class="curr-left">
                            <div class="flag">${flag}</div>
                            <div>
                                <div class="c-name">${item.currency}</div>
                                <div class="c-code">${item.code}</div>
                            </div>
                        </div>
                        <div class="curr-right">
                            <div class="p-box">
                               <span>شراء</span>
                               <strong>${item.buy}</strong>
                            </div>
                            <div class="p-box">
                               <span>بيع</span>
                               <strong>${item.sell}</strong>
                            </div>
                        </div>
                    </div>
                `;

                // خيارات المحول
                optionsHTML += `<option value="${item.sell}" data-code="${item.code}">${item.currency} (${item.code})</option>`;
            });

            document.getElementById('ratesTable').innerHTML = tableHTML;
            document.getElementById('fromCurrency').innerHTML = optionsHTML;
            document.getElementById('targetCurrency').innerHTML = optionsHTML;

            // تحديد خيارات مختلفة للمحول افتراضياً لو متاحة
            if(document.getElementById('targetCurrency').options.length > 1) {
                document.getElementById('targetCurrency').selectedIndex = 1;
            }

            if(data.length > 0 && data[0].updated) {
                document.getElementById('footerTimestamp').innerHTML = `Market Status: <span style="color: var(--accent-green);">OPEN</span> | آخر تحديث: ${data[0].updated}`;
            }

            convertCurrency();
        } catch (error) {
            document.getElementById('ratesTable').innerHTML = '<div style="text-align:center; color:#ef4444;">تعذر تحميل البيانات.</div>';
        }
    }

    function convertCurrency() {
        const amount = parseFloat(document.getElementById('amountInput').value) || 0;
        const fromSelect = document.getElementById('fromCurrency');
        const targetSelect = document.getElementById('targetCurrency');
        
        const rateFrom = parseFloat(fromSelect.value) || 1;
        const rateTarget = parseFloat(targetSelect.value) || 1;
        
        const codeFrom = fromSelect.options[fromSelect.selectedIndex]?.getAttribute('data-code') || '';
        const codeTarget = targetSelect.options[targetSelect.selectedIndex]?.getAttribute('data-code') || '';
        
        // التحويل المباشر بين العملات المتاحة
        let result = ((amount * rateFrom) / rateTarget).toFixed(2);
        
        document.getElementById('conversionResult').innerText = `النتيجة: ${result} ${codeTarget}`;
    }

    fetchRates();
    setInterval(fetchRates, 60000);
</script>

</body>
</html>
