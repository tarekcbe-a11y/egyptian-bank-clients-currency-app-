<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>#جروب_عملاء_البنوك_المصرية - أسعار العملات اللحظية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --border-gold: #d4af37;
            --text-gold: #f3e5ab;
            --text-white: #ffffff;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .phone-container {
            width: 100%;
            max-width: 420px;
            background: var(--bg-color);
            border: 2px solid var(--border-gold);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.2);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-gold);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-box {
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            color: #000;
            font-weight: 900;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 16px;
            letter-spacing: 1px;
        }
        .group-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-gold);
        }
        .sub-header {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }
        .rates-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .rate-card {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 12px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .currency-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .currency-flag {
            font-size: 24px;
        }
        .currency-name {
            font-weight: 700;
            font-size: 14px;
            color: var(--text-white);
        }
        .currency-code {
            font-size: 11px;
            color: var(--text-muted);
        }
        .prices-info {
            display: flex;
            gap: 15px;
            text-align: left;
        }
        .price-box .label {
            font-size: 10px;
            color: var(--text-muted);
            display: block;
        }
        .price-box .val {
            font-size: 14px;
            font-weight: 700;
            color: var(--border-gold);
        }
        .converter-section {
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .converter-title {
            font-size: 13px;
            color: var(--border-gold);
            font-weight: 700;
            margin-bottom: 10px;
            text-align: center;
            border-bottom: 1px dashed rgba(212, 175, 55, 0.3);
            padding-bottom: 6px;
        }
        .input-group {
            margin-bottom: 10px;
        }
        .input-group label {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 4px;
        }
        .input-group input, .input-group select {
            width: 100%;
            background: #0b0f19;
            border: 1px solid rgba(212, 175, 55, 0.5);
            color: #fff;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }
        .result-box {
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            color: #000;
            font-weight: 700;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            font-size: 15px;
            margin-top: 10px;
        }
        .footer-info {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            padding-top: 10px;
        }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="header">
        <div class="logo-area">
            <div class="logo-box">EG</div>
            <div class="group-title">جروب عملاء البنوك المصرية</div>
        </div>
        <div style="font-size: 18px;">🇪🇬 🇦🇪</div>
    </div>

    <div class="sub-header" id="updateStatus">جاري تحديث الأسعار اللحظية...</div>

    <!-- قائمة الأسعار المسحوبة من جدول البيانات -->
    <div class="rates-list" id="ratesList">
        <div style="text-align: center; color: var(--text-muted); padding: 20px;">جاري تحميل البيانات...</div>
    </div>

    <!-- قسم محول العملات -->
    <div class="converter-section">
        <div class="converter-title">تحويل العملات | CURRENCY CONVERTER</div>
        <div class="input-group">
            <label>المبلغ (EGP)</label>
            <input type="number" id="amountInput" value="1000" oninput="convertCurrency()">
        </div>
        <div class="input-group">
            <label>تحويل إلى العملة</label>
            <select id="targetCurrency" onchange="convertCurrency()">
                <!-- تملأ أوتوماتيكياً -->
            </select>
        </div>
        <div class="result-box" id="conversionResult">
            النتيجة: --
        </div>
    </div>

    <div class="footer-info">
        Market Status: <span style="color: var(--accent-green);">OPEN</span> | #جروب_عملاء_البنوك_المصرية
    </div>
</div>

<script>
    // رابط تطبيق الويب الخاص بجدول البيانات
    const apiURL = "https://script.google.com/macros/s/AKfycbzCRaR2BMwF5krfzHbW0tsMPvBOTEaTOiPMVGrPBr8o4PgKDu5Ht9embE_AD1c-b8Wg/exec";

    // علم افتراضي حسب كود العملة
    const flags = {
        "USD": "🇺🇸",
        "EUR": "🇪🇺",
        "GBP": "🇬🇧",
        "SAR": "🇸🇦",
        "AED": "🇦🇪",
        "KWD": "🇰🇼",
        "EGP": "🇪🇬"
    };

    let globalData = [];

    async function fetchRates() {
        try {
            const response = await fetch(apiURL);
            const data = await response.json();
            globalData = data;
            
            let listHTML = '';
            let selectHTML = '';

            data.forEach(item => {
                let flag = flags[item.code] || "💵";
                // كارت السعر
                listHTML += `
                    <div class="rate-card">
                        <div class="currency-info">
                            <div class="currency-flag">${flag}</div>
                            <div>
                                <div class="currency-name">${item.currency}</div>
                                <div class="currency-code">${item.code}</div>
                            </div>
                        </div>
                        <div class="prices-info">
                            <div class="price-box">
                                <span class="label">شراء</span>
                                <span class="val">${item.buy}</span>
                            </div>
                            <div class="price-box">
                                <span class="label">بيع</span>
                                <span class="val">${item.sell}</span>
                            </div>
                        </div>
                    </div>
                `;

                // خيارات محول العملات (باستثناء الجنيه المصري الأساسي لو حبيت أو حسب الرغبة)
                if(item.code !== 'EGP') {
                    selectHTML += `<option value="${item.sell}">${item.currency} (${item.code})</option>`;
                }
            });

            document.getElementById('ratesList').innerHTML = listHTML;
            document.getElementById('targetCurrency').innerHTML = selectHTML;
            
            if(data.length > 0 && data[0].updated) {
                document.getElementById('updateStatus').innerText = `آخر تحديث: ${data[0].updated}`;
            }

            convertCurrency();
        } catch (error) {
            document.getElementById('ratesList').innerHTML = '<div style="text-align:center; color:#ef4444;">تعذر تحميل البيانات، تأكد من الاتصال.</div>';
        }
    }

    function convertCurrency() {
        const amount = parseFloat(document.getElementById('amountInput').value) || 0;
        const selectElement = document.getElementById('targetCurrency');
        const rate = parseFloat(selectElement.value) || 1;
        
        // حساب التحويل (مقسوم على سعر البيع مثلاً أو العكس حسب الرغبة)
        const result = (amount / rate).toFixed(2);
        const selectedText = selectElement.options[selectElement.selectedIndex]?.text || '';
        
        document.getElementById('conversionResult').innerText = `النتيجة: ${result} (${selectedText.split(' ')[0]})`;
    }

    // جلب البيانات عند فتح الصفحة وتحديثها كل دقيقة
    fetchRates();
    setInterval(fetchRates, 60000);
</script>

</body>
</html>
