<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>#جروب_عملاء_البنوك_المصرية - أسعار العملات اللحظية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --border-gold: #d4af37;
            --text-gold: #f3e5ab;
            --text-white: #ffffff;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            padding: 10px;
            display: flex;
            justify-content: center;
        }
        .phone-container {
            width: 100%;
            max-width: 400px;
            background: var(--bg-color);
            border: 2px solid var(--border-gold);
            border-radius: 24px;
            padding: 15px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.2);
        }
        /* الهيدر */
        .header {
            text-align: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .group-title-main {
            font-size: 15px;
            font-weight: 900;
            color: var(--text-gold);
            letter-spacing: 0.5px;
        }
        .banner-text {
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-white);
            margin-bottom: 10px;
            border-bottom: 1px dashed rgba(212, 175, 55, 0.3);
            padding-bottom: 6px;
        }

        /* جدول الأسعار النظيف والمضغوط */
        .rates-table-container {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 12px;
        }
        .table-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px 8px 8px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 700;
        }
        .header-prices {
            display: flex;
            gap: 15px;
            text-align: center;
            width: 130px;
            justify-content: space-around;
        }
        .rates-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
        }
        .rate-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        .curr-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .flag { font-size: 18px; }
        .c-name { font-size: 12px; font-weight: 700; color: #fff; }
        
        .curr-right {
            display: flex;
            gap: 15px;
            text-align: center;
            width: 130px;
            justify-content: space-around;
        }
        .p-val { font-size: 12px; font-weight: 700; color: var(--border-gold); width: 50px; text-align: center; }

        /* شريط وقت التحديث */
        .update-time-box {
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 8px;
            padding: 6px;
            text-align: center;
            font-size: 10px;
            color: var(--text-gold);
            margin-bottom: 12px;
            font-weight: 600;
        }

        /* محول العملات */
        .converter-section {
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .converter-title {
            font-size: 12px;
            color: var(--border-gold);
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            border-bottom: 1px dashed rgba(212, 175, 55, 0.3);
            padding-bottom: 4px;
        }
        .conv-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        .input-group label {
            font-size: 10px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 2px;
        }
        .input-group input, .input-group select {
            width: 100%;
            background: #0b0f19;
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #fff;
            padding: 6px;
            border-radius: 6px;
            font-size: 11px;
            outline: none;
        }
        .result-box {
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            color: #000;
            font-weight: 700;
            text-align: center;
            padding: 8px;
            border-radius: 6px;
            font-size: 13px;
        }

        /* الفوتر */
        .footer-custom {
            text-align: center;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            padding-top: 8px;
        }
        .footer-group-name {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-gold);
            margin-bottom: 2px;
        }
        .footer-dev {
            font-size: 11px;
            color: var(--text-gold);
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="header">
        <div class="group-title-main">جروب عملاء البنوك المصرية</div>
    </div>

    <div class="banner-text">
        سعر صرف الجنيه المصري
    </div>

    <div class="rates-table-container">
        <div class="table-header-row">
            <span>العملة</span>
            <div class="header-prices">
                <span>شراء</span>
                <span>بيع</span>
            </div>
        </div>
        <div class="rates-list" id="ratesList">
            <div style="text-align: center; color: var(--text-muted); padding: 10px; font-size: 11px;">جاري تحميل الأسعار...</div>
        </div>
    </div>

    <div class="update-time-box" id="updateTimeBox">
        Market Status: <span style="color: var(--accent-green);">OPEN</span> | جاري تحميل وقت التحديث...
    </div>

    <div class="converter-section">
        <div class="converter-title">محول العملات | CURRENCY CONVERTER</div>
        <div class="input-group" style="margin-bottom: 8px;">
            <label>المبلغ المراد تحويله</label>
            <input type="number" id="amountInput" value="1000" oninput="convertCurrency()">
        </div>
        <div class="conv-grid">
            <div class="input-group">
                <label>من العملة</label>
                <select id="fromCurrency" onchange="convertCurrency()"></select>
            </div>
            <div class="input-group">
                <label>إلى العملة</label>
                <select id="targetCurrency" onchange="convertCurrency()"></select>
            </div>
        </div>
        <div class="result-box" id="conversionResult">
            النتيجة: --
        </div>
    </div>

    <div class="footer-custom">
        <div class="footer-group-name">جروب عملاء البنوك المصرية 🛡️</div>
        <div class="footer-dev">Developed by Tarek Metwally</div>
    </div>
</div>

<script>
    const apiURL = "https://script.google.com/macros/s/AKfycbzCRaR2BMwF5krfzHbW0tsMPvBOTEaTOiPMVGrPBr8o4PgKDu5Ht9embE_AD1c-b8Wg/exec";

    const flags = {
        "USD": "🇺🇸", "EUR": "🇪🇺", "GBP": "🇬🇧",
        "SAR": "🇸🇦", "AED": "🇦🇪", "KWD": "🇰🇼", "EGP": "🇪🇬"
    };

    let globalData = [];

    async function fetchRates() {
        try {
            const response = await fetch(apiURL);
            const data = await response.json();
            
            globalData = data.filter(item => item.buy > 0 && item.sell > 0);
            
            let listHTML = '';
            let optionsHTML = '';

            let conversionOptionsList = [
                { currency: "الجنيه المصري", code: "EGP", buy: 1, sell: 1 },
                ...globalData
            ];

            globalData.forEach(item => {
                let flag = flags[item.code] || "💵";
                
                // هنا الشراء ياخد (sell) والبيع ياخد (buy) للتمشي مع التبديل اللي تم من المصدر
                listHTML += `
                    <div class="rate-row">
                        <div class="curr-left">
                            <div class="flag">${flag}</div>
                            <div class="c-name">${item.currency}</div>
                        </div>
                        <div class="curr-right">
                            <div class="p-val">${item.sell}</div>
                            <div class="p-val">${item.buy}</div>
                        </div>
                    </div>
                `;
            });

            // ضبط المحول ليأخذ القيمة الأكبر (item.buy) لسعر البيع الفعلي بعد التبديل
            conversionOptionsList.forEach(item => {
                let flag = flags[item.code] || "💵";
                optionsHTML += `<option value="${item.buy}" data-code="${item.code}">${flag} ${item.currency}</option>`;
            });

            document.getElementById('ratesList').innerHTML = listHTML;
            document.getElementById('fromCurrency').innerHTML = optionsHTML;
            document.getElementById('targetCurrency').innerHTML = optionsHTML;

            document.getElementById('fromCurrency').selectedIndex = 0;
            if(document.getElementById('targetCurrency').options.length > 1) {
                document.getElementById('targetCurrency').selectedIndex = 1;
            }

            if(data.length > 0 && data[0].updated) {
                document.getElementById('updateTimeBox').innerHTML = `Market Status: <span style="color: var(--accent-green);">OPEN</span> | آخر تحديث: ${data[0].updated}`;
            }

            convertCurrency();
        } catch (error) {
            document.getElementById('ratesList').innerHTML = '<div style="text-align:center; color:#ef4444; font-size:11px;">تعذر تحميل البيانات.</div>';
        }
    }

    function convertCurrency() {
        const amount = parseFloat(document.getElementById('amountInput').value) || 0;
        const fromSelect = document.getElementById('fromCurrency');
        const targetSelect = document.getElementById('targetCurrency');
        
        const rateFrom = parseFloat(fromSelect.value) || 1;
        const rateTarget = parseFloat(targetSelect.value) || 1;
        
        const codeTarget = targetSelect.options[targetSelect.selectedIndex]?.getAttribute('data-code') || '';
        
        let result = ((amount * rateFrom) / rateTarget).toFixed(2);
        
        document.getElementById('conversionResult').innerText = `النتيجة: ${result} ${codeTarget}`;
    }

    fetchRates();
    setInterval(fetchRates, 60000);
</script>

</body>
</html>
