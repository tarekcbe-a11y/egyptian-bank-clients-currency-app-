<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>#جروب_عملاء_البنوك_المصرية - أسعار العملات اللحظية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --border-gold: #d4af37;
            --text-gold: #f3e5ab;
            --text-white: #ffffff;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            padding: 8px;
            display: flex;
            justify-content: center;
        }
        .phone-container {
            width: 100%;
            max-width: 380px;
            background: var(--bg-color);
            border: 1.5px solid var(--border-gold);
            border-radius: 18px;
            padding: 12px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
        }

        /* الهيدر */
        .header {
            text-align: center;
            border-bottom: 1px dashed rgba(212, 175, 55, 0.3);
            padding-bottom: 8px;
            margin-bottom: 8px;
        }
        .banner-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--text-gold);
        }
        .date-display {
            font-size: 10.5px;
            color: var(--text-muted);
            margin-top: 2px;
            font-weight: 600;
        }

        /* جدول الأسعار المضغوط */
        .rates-table-container {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            padding: 6px;
            margin-bottom: 8px;
        }
        .table-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 6px;
            font-size: 11px;
            color: var(--text-gold);
            font-weight: 700;
        }
        .header-prices {
            display: flex;
            gap: 12px;
            text-align: center;
            width: 120px;
            justify-content: space-around;
        }
        .rates-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-top: 5px;
        }
        .rate-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3px 6px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 5px;
        }
        .curr-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .flag { font-size: 15px; }
        .c-name { font-size: 11.5px; font-weight: 700; color: #fff; }
        
        .curr-right {
            display: flex;
            gap: 12px;
            text-align: center;
            width: 120px;
            justify-content: space-around;
        }
        .p-val { font-size: 11.5px; font-weight: 700; color: var(--border-gold); width: 45px; text-align: center; }

        /* شريط وقت التحديث */
        .update-time-box {
            background: rgba(212, 175, 55, 0.06);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 6px;
            padding: 4px;
            text-align: center;
            font-size: 9.5px;
            color: var(--text-gold);
            margin-bottom: 6px;
            font-weight: 600;
        }

        /* زر التحديث اليدوي */
        .refresh-btn-bar {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.25), rgba(170, 124, 17, 0.25));
            border: 1px solid var(--border-gold);
            color: var(--text-gold);
            border-radius: 6px;
            padding: 6px;
            text-align: center;
            font-size: 10.5px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease-in-out;
            user-select: none;
        }
        .refresh-btn-bar:active {
            transform: scale(0.98);
            background: rgba(212, 175, 55, 0.4);
        }

        /* محول العملات */
        .converter-section {
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 10px;
            padding: 8px;
            margin-bottom: 8px;
        }
        .converter-title {
            font-size: 11px;
            color: var(--text-gold);
            font-weight: 700;
            text-align: center;
            margin-bottom: 6px;
        }
        .conv-grid {
            display: grid;
            grid-template-columns: 0.8fr 1.1fr 1.1fr;
            gap: 6px;
            margin-bottom: 6px;
        }
        .input-group label {
            font-size: 9px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 2px;
        }
        .input-group input, .input-group select {
            width: 100%;
            background: #0b0f19;
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #fff;
            padding: 4px 6px;
            border-radius: 5px;
            font-size: 10.5px;
            outline: none;
        }
        .result-box {
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            color: #000;
            font-weight: 800;
            text-align: center;
            padding: 6px;
            border-radius: 5px;
            font-size: 12px;
        }

        /* الفوتر */
        .footer-custom {
            text-align: center;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            padding-top: 6px;
        }
        .footer-group-name {
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text-gold);
            margin-bottom: 1px;
        }
        .footer-dev {
            font-size: 9.5px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="header">
        <div class="banner-title">سعر صرف الجنيه المصري</div>
        <div class="date-display" id="currentDate">جاري تحميل التاريخ...</div>
    </div>

    <div class="rates-table-container">
        <div class="table-header-row">
            <span>العملة</span>
            <div class="header-prices">
                <span>شراء</span>
                <span>بيع</span>
            </div>
        </div>
        <div class="rates-list" id="ratesList">
            <div style="text-align: center; color: var(--text-muted); padding: 8px; font-size: 10px;">جاري تحميل الأسعار...</div>
        </div>
    </div>

    <div class="update-time-box" id="updateTimeBox">
        Market Status: <span style="color: var(--accent-green);">OPEN</span> | جاري تحميل الوقت...
    </div>

    <div class="refresh-btn-bar" onclick="fetchRates()">
        <span>🔄 اضغط لتحديث الأسعار الآن</span>
    </div>

    <div class="converter-section">
        <div class="converter-title">محول العملات | CURRENCY CONVERTER</div>
        <div class="conv-grid">
            <div class="input-group">
                <label>المبلغ</label>
                <input type="number" id="amountInput" value="1" oninput="convertCurrency()">
            </div>
            <div class="input-group">
                <label>من</label>
                <select id="fromCurrency" onchange="convertCurrency()"></select>
            </div>
            <div class="input-group">
                <label>إلى</label>
                <select id="targetCurrency" onchange="convertCurrency()"></select>
            </div>
        </div>
        <div class="result-box" id="conversionResult">
            النتيجة: --
        </div>
    </div>

    <div class="footer-custom">
        <div class="footer-group-name">جروب عملاء البنوك المصرية 🛡️</div>
        <div class="footer-dev">Developed by Tarek Metwally</div>
    </div>
</div>

<script>
    const apiURL = "https://script.google.com/macros/s/AKfycbzCRaR2BMwF5krfzHbW0tsMPvBOTEaTOiPMVGrPBr8o4PgKDu5Ht9embE_AD1c-b8Wg/exec";

    // دالة الفحص النصية الصارمة لربط كل عملة بعلمها الصحيح 100%
    function getFlagByName(currencyName) {
        const name = (currencyName || "").trim();
        
        if (name.includes("سعود") || name.includes("ريال")) return "🇸🇦"; // السعودية
        if (name.includes("إسترليني") || name.includes("استرلينى") || name.includes("استرليني")) return "🇬🇧"; // بريطانيا
        if (name.includes("دولار")) return "🇺🇸"; // أمريكا
        if (name.includes("يورو")) return "🇪🇺"; // اليورو
        if (name.includes("إمارات") || name.includes("امارات") || name.includes("درهم")) return "🇦🇪"; // الإمارات
        if (name.includes("كويت") || name.includes("دينار")) return "🇰🇼"; // الكويت (الدينار الكويتي)
        if (name.includes("مصري")) return "🇪🇬"; // مصر
        
        return "💵";
    }

    function displayDate() {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('currentDate').innerText = now.toLocaleDateString('ar-EG', options);
    }

    async function fetchRates() {
        try {
            const response = await fetch(apiURL);
            const data = await response.json();
            
            // جلب كل العملات بما فيها الدينار الكويتي (KWD) طالما بياناتها سليمة
            const filteredData = data.filter(item => item.buy > 0 && item.sell > 0);
            
            let listHTML = '';
            let optionsHTML = '';

            let conversionOptionsList = [
                { currency: "الجنيه المصري", code: "EGP", buy: 1, sell: 1 },
                ...filteredData
            ];

            filteredData.forEach(item => {
                let flag = getFlagByName(item.currency);
                
                listHTML += `
                    <div class="rate-row">
                        <div class="curr-left">
                            <div class="flag">${flag}</div>
                            <div class="c-name">${item.currency}</div>
                        </div>
                        <div class="curr-right">
                            <div class="p-val">${item.sell}</div>
                            <div class="p-val">${item.buy}</div>
                        </div>
                    </div>
                `;
            });

            conversionOptionsList.forEach(item => {
                let flag = getFlagByName(item.currency);
                optionsHTML += `<option value="${item.buy}" data-code="${item.code}">${flag} ${item.currency}</option>`;
            });

            document.getElementById('ratesList').innerHTML = listHTML;
            document.getElementById('fromCurrency').innerHTML = optionsHTML;
            document.getElementById('targetCurrency').innerHTML = optionsHTML;

            // ضبط المحول ليبدأ من (الدولار الأمريكي) إلى (الجنيه المصري)
            const usdIndex = conversionOptionsList.findIndex(item => (item.currency || "").includes("دولار"));
            const egpIndex = conversionOptionsList.findIndex(item => (item.currency || "").includes("مصري"));

            if(usdIndex !== -1) document.getElementById('fromCurrency').selectedIndex = usdIndex;
            if(egpIndex !== -1) document.getElementById('targetCurrency').selectedIndex = egpIndex;

            if(data.length > 0 && data[0].updated) {
                document.getElementById('updateTimeBox').innerHTML = `Market Status: <span style="color: var(--accent-green);">OPEN</span> | آخر تحديث: ${data[0].updated}`;
            }

            convertCurrency();
        } catch (error) {
            document.getElementById('ratesList').innerHTML = '<div style="text-align:center; color:#ef4444; font-size:10px;">تعذر تحميل البيانات.</div>';
        }
    }

    function convertCurrency() {
        const amount = parseFloat(document.getElementById('amountInput').value) || 0;
        const fromSelect = document.getElementById('fromCurrency');
        const targetSelect = document.getElementById('targetCurrency');
        
        const rateFrom = parseFloat(fromSelect.value) || 1;
        const rateTarget = parseFloat(targetSelect.value) || 1;
        
        const codeTarget = targetSelect.options[targetSelect.selectedIndex]?.getAttribute('data-code') || '';
        
        let rawResult = ((amount * rateFrom) / rateTarget);
        let formattedResult = rawResult.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        
        document.getElementById('conversionResult').innerText = `النتيجة: ${formattedResult} ${codeTarget}`;
    }

    displayDate();
    fetchRates();
    setInterval(fetchRates, 60000);
</script>

</body>
</html>
